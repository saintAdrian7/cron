# Free alternative to a Render Cron Job — pings the targets on a schedule using
# GitHub's runners. Costs nothing on public repos.
#
# Caveats vs Render cron:
#   - Scheduled runs can be delayed several minutes under GitHub load.
#   - Scheduled workflows are auto-disabled after 60 days of repo inactivity
#     (a manual run or any commit re-enables them).
#
# Setup: add a repo variable named TARGETS (Settings → Secrets and variables →
# Actions → Variables) with the comma-separated URLs to ping.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch: {} # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node ping.mjs
        env:
          TARGETS: ${{ vars.TARGETS }}
